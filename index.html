<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<script src="script.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<style>
    *{
        margin: 0;
        padding: 0;
    }

    body{
        margin:0;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background: linear-gradient(#9fd6ff,#bfe7ff);
    }

    .calculator{
        width:320px;
        background: #eaf4ff;
        border-radius:28px;
        padding:20px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
    }

    .display{
        height:90px;
        background: #d8ecff;
        border-radius:18px;
        padding:15px;
        text-align:right;
        font-size:28px;
        font-weight:600;
        color:#1a1a1a;
        overflow:hidden;
    }

    .display small{
        font-size:14px;
        opacity:.6;
        display:block;
    }

    .buttons{
        margin-top:18px;
        display:grid;
        grid-template-columns: repeat(4, 1fr);
        gap:12px;
    }

    button{
        height:54px;
        border:none;
        border-radius:14px;
        font-size:18px;
        cursor:pointer;
        background:#d8ecff;
        box-shadow: 0 1px 0 rgba(255,255,255,.6);
    }

    button:active{
        transform: scale(.97);
    }

    .op{
        background:#5fa8ff;
        color: rgb(255, 255, 255);
        font-size:25px;
    }

    .plus{
        grid-row: span 2;
        background:#5fa8ff;
        color:rgb(255, 255, 255);
        font-size:22px;
        height: 120px;
    }

    .equal{
        background:#0c58b4;
        color:white;
        font-size:22px;
    }

    .zero{
        grid-column: span 2;
    }

    .clear,.delete{
        color: rgb(255, 255, 255);
        background:#7ec6e2;
    }
</style>
</head>

<body>

<div class="calculator">
    <div class="display" id="display">
        <small id="history"></small>
        <span id="result">0</span>
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearAll()">AC</button>
        <button class="delete" onclick="del()"><i class="fa-solid fa-delete-left"></i></button>
        <button class="op" onclick="append('/')">/</button>
        <button class="op" onclick="append('*')">*</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="op" onclick="append('-')">-</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="plus" onclick="append('+')">+</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>

        <button class="zero" onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

</body>
</html>
